[package]
name = "aperture"
version = "1.2.0"
default-run = "aperture"
edition = "2021"

[lib]
name = "aperture_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
regex = "1"
# aperture-wul6m liveness watchdog: sync WS subscriber to the aperture-bus hub
# (runs in a dedicated std::thread — matches the poller/ws_hub daemon pattern,
# no tokio). chrono formats kickoff/dot timestamps as ISO 8601 per
# docs/presence-dots-spec.md.
tungstenite = "0.24"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
toml = "0.8"
