<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1115">
<title>Aperture está desligado</title>
<link rel="icon" href="/icons/aperture.svg">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f1115; color: #e7e9ee;
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { text-align: center; padding: 24px; }
  img { width: 88px; height: 88px; opacity: .55; }
  h1 { font-size: 18px; margin: 18px 0 6px; }
  p { color: #9aa1ad; margin: 0 0 18px; }
  code { background: #171a21; padding: 2px 6px; border-radius: 4px; }
  button { font: inherit; color: #fff; background: #7c9cff; border: 0; border-radius: 6px; padding: 7px 16px; cursor: pointer; }
  .auto { font-size: 12px; margin-top: 12px; }
</style>
</head>
<body>
<main>
  <img src="/icons/aperture.svg" alt="">
  <h1>Aperture está desligado</h1>
  <p>O servidor em <code id="host">127.0.0.1:4518</code> não respondeu.</p>
  <button id="retry">Tentar de novo</button>
  <p class="auto" id="auto"></p>
</main>
<script>
  // Shown by the service worker when the hub is down. Retry by hand, or
  // automatically every 5s: back on the page as soon as the hub answers.
  document.getElementById("host").textContent = location.host;
  const retry = () => location.reload();
  document.getElementById("retry").addEventListener("click", retry);
  let n = 5;
  const auto = document.getElementById("auto");
  setInterval(async () => {
    if (--n > 0) { auto.textContent = `Tentando de novo em ${n}s…`; return; }
    n = 5;
    try { if ((await fetch("/health", { cache: "no-store" })).ok) retry(); } catch (_) {}
  }, 1000);
</script>
</body>
</html>
